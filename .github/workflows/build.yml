name: Build CopyPilot

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -like 'refs/tags/v*') {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            [xml]$props = Get-Content Directory.Build.props
            $base = [version]$props.Project.PropertyGroup.Version
            $v = "$($base.Major).$($base.Minor).${{ github.run_number }}"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build (AzCopy download, tests, publish, MSI)
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: CopyPilot-${{ steps.version.outputs.version }}-msi
          path: artifacts/*.msi

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CopyPilot-${{ steps.version.outputs.version }}-portable
          path: artifacts/*-portable.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CopyPilot ${{ steps.version.outputs.version }}
          body: |
            CopyPilot ${{ steps.version.outputs.version }} – created by Arnold Kolkman.
            Includes the latest Microsoft AzCopy v10 at build time.
          files: |
            artifacts/*.msi
            artifacts/*-portable.zip
